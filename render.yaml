# Blueprint Render : https://render.com/docs/blueprint-spec
services:
  - type: web
    name: rush-epfl
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Obligatoire pour que les codes de connexion partent par e-mail.
      # L'offre gratuite de Render bloque les ports SMTP : les codes partent
      # d'un compte Gmail via le script scripts/gmail-mailer.gs (gratuit,
      # sans clé d'API) ; ici, l'URL de son déploiement « Application Web ».
      - key: MAIL_SCRIPT_URL
        sync: false
      - key: RUSH_WELCOME_BONUS_CENTS
        value: "100"
      # Facultatif : photos et avis Google Maps des spots (Places API New).
      # Sans clé, les fiches affichent la couverture et les liens vers les sources.
      - key: GOOGLE_MAPS_API_KEY
        sync: false
