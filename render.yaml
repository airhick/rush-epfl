# Blueprint Render : https://render.com/docs/blueprint-spec
services:
  - type: web
    name: rush-epfl
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUSH_WELCOME_BONUS_CENTS
        value: "100"
      # Facultatif : photos et avis Google Maps des spots (Places API New).
      # Sans clé, les fiches affichent la couverture et les liens vers les sources.
      - key: GOOGLE_MAPS_API_KEY
        sync: false
