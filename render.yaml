# Blueprint Render : https://render.com/docs/blueprint-spec
services:
  - type: web
    name: rush-epfl
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Obligatoire pour que les codes de connexion partent par e-mail.
      # L'offre gratuite de Render bloque les ports SMTP : on passe par
      # l'API HTTP de Brevo (gratuit, 300 e-mails/jour). MAIL_FROM doit
      # être l'expéditeur validé dans Brevo, ex. « Rush <toi@gmail.com> ».
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: RUSH_WELCOME_BONUS_CENTS
        value: "100"
      # Facultatif : photos et avis Google Maps des spots (Places API New).
      # Sans clé, les fiches affichent la couverture et les liens vers les sources.
      - key: GOOGLE_MAPS_API_KEY
        sync: false
